[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror7-backend"
version = "0.1.0"
description = "UI-independent HTTP backend boundary for Mirror 7"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]
license = {text = "Apache-2.0"}

[project.scripts]
mirror7 = "mirror_cli:main"
mirror-crystal = "mirror_crystal.cli:main"
mirror7-server = "mirror7_backend.http_server:serve"

[tool.setuptools]
py-modules = ["mirror_cli"]

[tool.setuptools.packages.find]
include = [
  "mirror7_backend*",
  "mirror_crystal*",
  "mirror_eval*",
  "mirror_lm*",
  "phase359_response_generation_adapter*",
  "phase362_response_generation_config*",
  "phase364_response_generation_validation*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "mirror7_backend",
  "phase329_backend_integration",
  "phase330_backend_api",
  "phase331_backend_e2e",
  "phase332_backend_finalization",
  "phase333_backend_reliability",
  "phase334_backend_api",
  "phase335_backend_hardening",
  "phase341_pre_gpu_readiness",
  "phase342_release_boundary",
  "training",
  "mirror_crystal",
  "mirror_eval",
  "mirror_lm",
]
