
name: Mirror 7 phases-275-278
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q phase275_sealed_evaluation/test_phase275.py phase276_scaling_ablation/test_phase276.py phase277_end_to_end_integration/test_phase277.py phase278_open_world_benchmark/test_phase278.py
