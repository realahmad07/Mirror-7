name: Mirror 7 pre-GPU readiness

on:
  push:
    branches: [main]
    paths:
      - "mirror7_backend/**"
      - "phase140_unified_cognitive_runtime/**"
      - "phase341_pre_gpu_readiness/**"
      - "pyproject.toml"
      - ".github/workflows/pre-gpu-readiness.yml"
  pull_request:
    paths:
      - "mirror7_backend/**"
      - "phase140_unified_cognitive_runtime/**"
      - "phase341_pre_gpu_readiness/**"
      - "pyproject.toml"
      - ".github/workflows/pre-gpu-readiness.yml"
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest build
      - run: python -m pytest -q phase341_pre_gpu_readiness/test_phase341.py phase331_backend_e2e/test_phase331.py phase330_backend_api/test_phase330.py phase329_backend_integration/test_phase329.py mirror7_backend/test_http_server.py
      - run: python -m compileall -q mirror7_backend phase140_unified_cognitive_runtime phase341_pre_gpu_readiness
      - run: python -m build
