name: phase343-semantic-state

on:
  push:
    branches: [main]
    paths:
      - "phase343_semantic_state/**"
  pull_request:
    paths:
      - "phase343_semantic_state/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q phase343_semantic_state/test_phase343.py
