name: Mirror 7 training foundation

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "requirements-training.txt"
      - ".github/workflows/training-foundation.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "training/**"
      - "requirements-training.txt"
      - ".github/workflows/training-foundation.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  training-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q training/test_training_foundation.py
      - run: python -m training.make_smoke_dataset
      - run: python -m training.validate_dataset --dataset training/data/smoke.jsonl
      - run: python -m compileall -q training
