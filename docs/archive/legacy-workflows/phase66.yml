name: phase66
on:
  push:
    paths:
      - "phase66_richer_hidden_state/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m phase66_richer_hidden_state.run_phase66_gate
      - run: python -m pytest phase66_richer_hidden_state/test_phase66.py -q
