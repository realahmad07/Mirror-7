name: Mirror 7 phases 201-210 lifelong learning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lifelong:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Phase 201-210 focused gate
        run: python -m pytest -q phase201_210_lifelong_learning/test_phase201_210.py
