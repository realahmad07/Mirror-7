name: Mirror 7 phases-291-298
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  source-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q phase291_patch_model/test_phase291.py phase292_patch_validation/test_phase292.py phase293_patch_application/test_phase293.py phase294_source_evaluator/test_phase294.py phase295_redesign_proposer/test_phase295.py phase296_source_promotion/test_phase296.py phase297_autonomous_redesign/test_phase297.py phase298_integrated_self_redesign/test_phase298.py
