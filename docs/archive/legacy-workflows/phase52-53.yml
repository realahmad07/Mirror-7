name: Phase 52-53 Generalization Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phase52-53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Phase 53 evaluator integrity
        run: python -m pytest phase53_independent_eval -q
      - name: Phase 52 learner integration
        run: python -m pytest phase52_open_learning -q
