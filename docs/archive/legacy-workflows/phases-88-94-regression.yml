name: phases-88-94-regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run phases 88-94
        run: python -m pytest -q phase88 phase89 phase90 phase91 phase92 phase93 phase94
      - name: Run regression phases 77-87
        run: python -m pytest -q phase77_integrated_autonomous_loop phase78_cross_regime_environment_learning phase79_long_horizon_self_correction phase80_unified_autonomous_system phase81_persistent_transfer_memory phase82_autonomous_regression_gate phase83_self_model_consistency phase84_compositional_state_graph phase85_integrated_agent phase86_horizon_planning phase87_curriculum_memory
