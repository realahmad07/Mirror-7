
name: Mirror 7 phases-267-270
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q phase267_general_representation/test_phase267.py phase268_compositional_semantics/test_phase268.py phase269_open_affordance_discovery/test_phase269.py phase270_long_horizon_planning/test_phase270.py
