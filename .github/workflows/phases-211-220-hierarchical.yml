name: Mirror 7 phases 211-220 hierarchical reasoning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Phase 211-220 focused gate
        run: python -m pytest -q phase211_220_hierarchical_reasoning/test_phase211_220.py
