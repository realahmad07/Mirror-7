name: MIRROR7 Phase 27 Live Debug
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical compiler word-id ABI and regenerate artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('phase27_unfinished/build_phase27.py').read_text()
          forbidden=(
              "w.t('find-word','swap','19','!','18','!')",
              "w.t('find-word','swap','21','!','20','!')",
          )
          if any(x in s for x in forbidden):
              raise SystemExit('Phase 27 ABI regression: compile-structured must use canonical find-word result order')
          PY
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/phase27_unfinished/build_phase27.py")
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
      - name: Run Step 2 verification
        shell: bash
        run: python3 phase27_unfinished/verify_phase27.py
