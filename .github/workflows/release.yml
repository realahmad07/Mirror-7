name: Mirror 7 | Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror7-backend-dist
          path: dist/
