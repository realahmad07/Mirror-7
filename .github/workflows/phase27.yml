name: MIRROR7 Phase 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structured-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate artifact and verify
        run: |
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          cp phase27_unfinished/build_phase27.py "$tmp/build_phase27.py"
          (cd "$tmp" && python3 build_phase27.py)
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          python3 phase27_unfinished/verify_phase27.py
      - name: Commit builder and artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr
          if ! git diff --cached --quiet; then
            git commit -m "build(phase27): synchronize builder and generated artifact"
            git push origin HEAD:main
          fi
      - name: Record Step 2 PASS
        run: |
          printf '# Phase 27 Step 2 — PASS\n\nSurface parser verification passed: literals, IF/ELSE/THEN, false branch, and nested structured control flow all produced the expected output.\n\nCommit: %s\n' "$GITHUB_SHA" > phase27_unfinished/STEP2_PASS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase27_unfinished/STEP2_PASS.md
          git commit -m 'test: record Phase 27 step 2 surface parser PASS'
          git push origin HEAD:main
      - name: Dispatch canonical Step 2 verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/phase27_step2_verify.yml/dispatches" \
            -d '{"ref":"main"}'
