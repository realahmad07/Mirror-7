name: MIRROR7 Phase 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structured-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Phase 27 builder control-flow and storage rewrites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('phase27_unfinished/build_phase27.py')
          s = p.read_text()
          old = "for i in range(len(body)-3):\n                if body[i:i+4]==['word-count','16','!','15','!']:"
          new = "for i in range(len(body)-4):\n                if body[i:i+5]==['word-count','16','!','15','!']:"
          if old not in s: raise SystemExit('find-word storage pattern missing')
          s = s.replace(old,new,1)
          old_pipeline = "base_lines=relocate(base_lines,PRIM_DELTA); base_lines=repair_structured_passes(base_lines); base_lines=repair_find_word_storage(base_lines); base_lines=repair_find_word_targets(base_lines)"
          new_pipeline = "base_lines=relocate(base_lines,PRIM_DELTA); base_lines=repair_structured_passes(base_lines); base_lines=repair_create_pass_branches(base_lines); base_lines=repair_find_word_storage(base_lines); base_lines=repair_find_word_targets(base_lines)"
          if old_pipeline not in s: raise SystemExit('builder pipeline anchor missing')
          s = s.replace(old_pipeline,new_pipeline,1)
          anchor = "def repair_find_word_storage(lines):\n"
          helper = '''def repair_create_pass_branches(lines):
    out=[]; addr=PRIM_BYTES
    for line in lines:
        toks=line.split()
        if toks and toks[0]==':' and toks[1]=='create-pass':
            body=toks[2:-1]; pcs=[]; pc=addr
            for t in body: pcs.append(pc); pc+=token_size(t)
            bs=[i for i,t in enumerate(body) if t.startswith('0branch:') or t.startswith('branch:')]
            if len(bs)!=8: raise ValueError('create-pass branch count changed: '+str(len(bs)))
            ex=body.index('exit'); dr=body.index('drop'); st=body.index('scan-token')
            targets=[pcs[ex],pcs[dr],pcs[dr],pcs[dr],pcs[dr],pcs[dr],pcs[st],pcs[dr]]
            for j,i in enumerate(bs): body[i]=('0branch:' if body[i].startswith('0branch:') else 'branch:')+str(targets[j])
            toks=toks[:2]+body+toks[-1:]; line=' '.join(toks)
        out.append(line)
        if toks: addr+=sum(token_size(t) for t in toks[2:-1])+1
    return out
'''
          if anchor not in s: raise SystemExit('find-word helper anchor missing')
          if 'def repair_create_pass_branches(lines):' not in s:
              s = s.replace(anchor,helper+anchor,1)
          old_carry = "if body[i:i+4]==['1','14','@','+','14','@']:"
          new_carry = "if body[i:i+5]==['1','14','@','+','14','@']:"
          if old_carry in s:
              s=s.replace(old_carry,new_carry,1).replace("body[i:i+4]=['1','14','@','+','14','!']","body[i:i+5]=['1','14','@','+','14','!']",1)
          p.write_text(s)
          PY
      - name: Generate and synchronize Phase 27 builder and artifact
        run: |
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/phase27_unfinished/build_phase27.py")
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          python3 -m py_compile phase27_unfinished/build_phase27.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr
          if ! git diff --cached --quiet; then
            git commit -m "fix(phase27): persist deterministic create-pass relocation"
            git push
          fi
      - name: Phase 27 end-to-end verification
        run: TRACE_VM=1 TRACE_PATCH=1 TRACE_CODE=1 python3 phase27_unfinished/verify_phase27.py
