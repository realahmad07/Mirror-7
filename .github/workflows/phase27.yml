name: MIRROR7 Phase 27

on:
  push:
    branches: [main]
    paths-ignore:
      - 'phase27_unfinished/compiler_phase27_words.mirr'
      - 'phase27_unfinished/STEP2_PASS.md'
      - 'phase27_unfinished/STEP2_FAIL.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structured-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate artifact and verify
        run: |
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          cp phase27_unfinished/build_phase27.py "$tmp/build_phase27.py"
          (cd "$tmp" && python3 build_phase27.py)
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          python3 phase27_unfinished/verify_phase27.py
      - name: Commit builder and artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr
          if ! git diff --cached --quiet; then
            git commit -m "build(phase27): synchronize builder and generated artifact"
            git push origin HEAD:main
          fi
      - name: Verify synchronized Phase 27 artifact
        run: |
          test -s phase27_unfinished/compiler_phase27_words.mirr
          python3 phase27_unfinished/verify_phase27.py
