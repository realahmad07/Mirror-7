name: MIRROR7 Phase 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structured-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Phase 27 builder storage rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('phase27_unfinished/build_phase27.py')
          s = p.read_text()
          old = "for i in range(len(body)-3):\n                if body[i:i+4]==['word-count','16','!','15','!']:"
          new = "for i in range(len(body)-4):\n                if body[i:i+5]==['word-count','16','!','15','!']:"
          if old not in s:
              raise SystemExit('expected find-word storage rewrite pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Nucleus opcode/debug map
        run: |
          grep -nE 'enum|OP_|word_exec|word-patch|word_append|word_new|word_count|JZ|BRANCH' phase25_26/nucleus.c | head -n 220
      - name: Generate and synchronize Phase 27 artifact
        run: |
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/phase27_unfinished/build_phase27.py")
          sha256sum "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- phase27_unfinished/compiler_phase27_words.mirr; then
            git add phase27_unfinished/compiler_phase27_words.mirr
            git commit -m "build: synchronize Phase 27 generated artifact"
            git push
          fi
      - name: Phase 27 end-to-end verification
        run: TRACE_VM=1 TRACE_PATCH=1 TRACE_CODE=1 python3 phase27_unfinished/verify_phase27.py
      # Builder now derives relocation from the current Phase 26 source; no hard-coded insertion offset.
