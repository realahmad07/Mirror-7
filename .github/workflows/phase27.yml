name: MIRROR7 Phase 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structured-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair builder deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('phase27_unfinished/build_phase27.py')
          s=p.read_text()
          pat=r"            if toks and toks\[0\]==':' and toks\[1\]=='create-pass':\n.*?            elif toks and toks\[0\]==':' and toks\[1\]=='compile-pass':"
          repl="""            if toks and toks[0]==':' and toks[1]=='create-pass':
                body=toks[2:-1]; pcs=[]; pc=addr
                for t in body: pcs.append(pc); pc+=token_size(t)
                bs=[i for i,t in enumerate(body) if t.startswith('0branch:') or t.startswith('branch:')]
                if len(bs)!=8: raise ValueError('create-pass branch count changed')
                ex=body.index('exit'); dr=body.index('drop'); st=body.index('scan-token')
                targets=[pcs[ex],pcs[dr],pcs[dr],pcs[dr],pcs[dr],pcs[dr],pcs[st],pcs[dr]]
                for j,i in enumerate(bs): body[i]=('0branch:' if body[i].startswith('0branch:') else 'branch:')+str(targets[j])
                toks=toks[:2]+body+toks[-1:]; line=' '.join(toks)
            elif toks and toks[0]==':' and toks[1]=='compile-pass':"""
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('create-pass repair block not found')
          old="for i in range(len(body)-3):\n                if body[i:i+4]==['word-count','16','!','15','!']:"
          new="for i in range(len(body)-4):\n                if body[i:i+5]==['word-count','16','!','15','!']:"
          if old in s2: s2=s2.replace(old,new,1)
          # Phase 27 compile-structured must preserve the established find-word u16 ABI.
          # find-word returns LOW,HIGH; callers store HIGH at the higher cell and LOW at the lower cell.
          s2=s2.replace("w.t('find-word','swap','19','!','18','!')", "w.t('find-word','19','!','18','!')")
          s2=s2.replace("w.t('find-word','swap','21','!','20','!','9','10','!','emit-byte','20','@','10','!','emit-byte','21','@','10','!','emit-byte')", "w.t('find-word','21','!','20','!','9','10','!','emit-byte','20','@','10','!','emit-byte','21','@','10','!','emit-byte')")
          p.write_text(s2)
          PY
      - name: Regenerate artifact and verify
        run: |
          tmp=$(mktemp -d)
          cp phase25_26/compiler_phase26_words.mirr "$tmp/compiler_phase26_words.mirr"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/phase27_unfinished/build_phase27.py")
          cp "$tmp/compiler_phase27_words.mirr" phase27_unfinished/compiler_phase27_words.mirr
          python3 phase27_unfinished/verify_phase27.py
      - name: Commit builder and artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr
          if ! git diff --cached --quiet; then
            git commit -m "fix(phase27): persist semantic create-pass relocation"
            git push origin HEAD:main
          fi
