name: Mirror 7 | CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    env:
      # CI unit suites use the explicitly downgraded process runner for speed/repeatability.
      # The direct container smoke test below separately verifies the production boundary.
      MIRROR_SANDBOX_MODE: process
      MIRROR_REQUIRE_CONTAINER_SANDBOX: "1"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch production Crystal vault from Git LFS
        run: |
          git lfs version
          git lfs install --local
          git lfs pull --include="restorevalutecrytaled/mirror_crystal_all_datasets.dcrystal" --exclude="restorevalutecrytaled/mirror_crystal_all_datasets_dcrystal.zip"
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          vault = Path("restorevalutecrytaled/mirror_crystal_all_datasets.dcrystal")
          if not vault.is_file():
              raise SystemExit(f"Production vault is missing: {vault}")
          with vault.open("rb") as stream:
              if stream.read(16) != b"SQLite format 3" + bytes([0]):
                  raise SystemExit("Production vault is still a Git LFS pointer, not a SQLite database.")

          with sqlite3.connect(vault) as connection:
              check = connection.execute("PRAGMA quick_check").fetchone()[0]
              if check != "ok":
                  raise SystemExit(f"Production vault SQLite quick_check failed: {check}")
              tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              required = {"rules", "rule_hygiene_quarantine", "verified_production_index"}
              missing = required - tables
              if missing:
                  raise SystemExit(f"Production vault is missing required tables: {sorted(missing)}")
              total = connection.execute("SELECT COUNT(*) FROM rules").fetchone()[0]
              print(f"Production vault ready: SQLite quick_check={check}; rules={total}; required tables present.")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and build tools
        run: python -m pip install --upgrade pip setuptools wheel pytest build cryptography
      - name: Pull isolated Python container image
        run: docker pull python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
      - name: Compile active backend and training code
        run: python -m compileall -q mirror7_backend training mirror_crystal mirror_eval
      - name: Mirror Crystal & honest CPU eval tests
        run: python -m pytest -q mirror_crystal mirror_eval
      - name: Validate frozen source-backed benchmark manifest
        run: >-
          python -m mirror_eval.factual_benchmark
          --dataset mirror_eval/data/source_backed_factual_v1.jsonl
          --manifest mirror_eval/data/source_backed_factual_v1.manifest.json
          --validate-only
      - name: Backend tests
        run: python -m pytest -q mirror7_backend
      - name: Backend smoke and release-boundary tests
        run: python -m pytest -q phase324_backend_smoke phase342_release_boundary
      - name: Training foundation tests
        run: python -m pytest -q training/test_training_foundation.py
      - name: Free-running evaluator tests
        run: python -m pytest -q training/test_free_running_eval.py
      - name: Build and validate smoke dataset
        run: |
          python -m training.make_smoke_dataset
          python -m training.validate_dataset --dataset training/data/smoke.jsonl
      - name: Build package
        run: python -m build
