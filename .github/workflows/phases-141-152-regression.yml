name: Mirror 7 phases 141-152 regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run integrated gate
        run: python -m pytest -q phase141_152_integration/test_phase141_152.py
      - name: Run original algorithm suites
        shell: bash
        run: |
          set -e
          for i in $(seq -w 1 12); do
            python mirror7_algorithm_${i}/test_mirror7_algorithm.py
          done
