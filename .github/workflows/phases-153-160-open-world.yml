name: Mirror 7 phases 153-160 open-world regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  open-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Re-run 141-152 integration gate
        run: python -m pytest -q phase141_152_integration/test_phase141_152.py
      - name: Run 153-160 open-world gate
        run: python -m pytest -q phase153_160_open_world/test_phase153_160.py
      - name: External evaluator smoke check
        shell: bash
        run: |
          set -e
          printf '{"prediction_accuracy":1.0,"unknown_confidence":0.1,"max_memory":64,"max_workspace":64}
' |
            python phase153_160_open_world/independent_evaluator.py
          if printf '{"prediction_accuracy":0.5,"unknown_confidence":0.5,"max_memory":2000,"max_workspace":200}
' |
            python phase153_160_open_world/independent_evaluator.py; then
            echo "Negative control unexpectedly passed"
            exit 1
          fi
