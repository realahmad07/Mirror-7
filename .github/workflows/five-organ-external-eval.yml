name: Mirror 7 | Five-Organ External Holdout

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_five_organ_external_eval.py"
      - ".github/workflows/five-organ-external-eval.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  external-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIRROR_SANDBOX_MODE: container
      MIRROR_REQUIRE_CONTAINER_SANDBOX: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42.0"

      - name: Pull pinned zero-trust sandbox image
        run: docker pull python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39

      - name: Run five-organ held-out external evaluation
        run: |
          python scripts/run_five_organ_external_eval.py \
            --output artifacts/five_organ_external_eval.json \
            --sample-size 20

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror7-five-organ-external-eval
          path: artifacts/five_organ_external_eval.json
          if-no-files-found: warn
          retention-days: 30
