name: Mirror 7 phase-326 backend service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  phase326:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q mirror7_backend phase326_backend_service
      - run: python -m pytest -q phase326_backend_service/test_phase326.py phase320_backend_runtime/test_phase320.py phase321_persistence/test_phase321.py phase322_action_gateway/test_phase322.py phase323_backend_integration/test_phase323.py phase324_backend_smoke/test_phase324.py
