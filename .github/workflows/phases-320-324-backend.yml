name: Mirror 7 backend phases 320-324

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q mirror7_backend phase320_backend_runtime phase321_persistence phase322_action_gateway phase323_backend_integration phase324_backend_smoke
      - run: >
          python -m pytest -q
          phase320_backend_runtime/test_phase320.py
          phase321_persistence/test_phase321.py
          phase322_action_gateway/test_phase322.py
          phase323_backend_integration/test_phase323.py
          phase324_backend_smoke/test_phase324.py
      - run: python -m pytest -q phase307_capability_adapter_contract/test_phase307.py phase308_planning_frontier_adapter/test_phase308.py phase309_language_frontier_adapter/test_phase309.py phase310_reasoning_frontier_adapter/test_phase310.py phase311_adapter_registry/test_phase311.py phase312_multicapability_frontier/test_phase312.py phase313_multi_capability_campaign/test_phase313.py phase314_frontier_integration/test_phase314.py
