name: MIRROR7 Phase 27 Step 2 Verify

on:
  workflow_run:
    workflows: ["MIRROR7 Phase 27"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step2:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run surface parser gate
        run: python3 phase27_unfinished/verify_phase27.py
      - name: Require synchronized generated artifact
        run: test -s phase27_unfinished/compiler_phase27_words.mirr
      - name: Report PASS
        run: echo "PHASE27_STEP2_VERIFY_PASS"
