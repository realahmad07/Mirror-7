name: conflict-repair-regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Phase 29 verifier
        run: python phase29_mirr_compiler/verify_phase29.py
      - name: Run Phase 30 verifier
        run: python phase30_compiler_mirr/verify_phase30.py
      - name: Run Phase 52 tests
        run: python -m pip install pytest && python -m pytest -q phase52_open_learning
