name: Mirror 7 | Rebuild production Crystal vault

on:
  push:
    branches: [main]
    paths:
      - "scripts/rebuild_publication_vault.py"
      - "rules_and_blueprints/**"
      - "artifacts/mirror_crystal_v1.mcrystal"
      - ".github/workflows/rebuild-publication-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-crystal-vault-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_SANDBOX_MODE: process
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest cryptography

      - name: Compile rebuild script and Mirror
        run: |
          python -m py_compile scripts/rebuild_publication_vault.py
          python -m compileall -q mirror_crystal mirror_eval

      - name: Validate and rebuild the production .dcrystal vault
        run: python scripts/rebuild_publication_vault.py

      - name: Run full Crystal and evaluation regression suites
        run: python -m pytest -q mirror_crystal mirror_eval

      - name: Mark complete regression suite in build report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/mirror_crystal_rebuild_report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          report.setdefault("tests", {})["pytest_mirror_crystal_and_mirror_eval"] = "PASS"
          report["status"] = "PASS"
          p.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Confirm branch has not moved during the rebuild
        run: |
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "main moved from $GITHUB_SHA to $CURRENT_SHA during rebuild; refusing to publish a stale vault."
            exit 1
          fi

      - name: Commit the rebuilt database and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mirror_crystal_all_datasets.dcrystal artifacts/mirror_crystal_rebuild_report.json
          git diff --cached --check
          git commit -m "build: restore production Crystal vault from published datasets"
          git push origin HEAD:main

      - name: Preserve rebuild report on the workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-crystal-vault-rebuild-report
          path: artifacts/mirror_crystal_rebuild_report.json
          if-no-files-found: ignore
