name: Mirror 7 | CPU-Native Learning Research (S0-S8)

on:
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "research/cpu_learning/**"
      - "docs/39-cpu-native-learning-research-s0-audit-and-baseline.md"
      - "docs/40-cpu-native-learning-research-s1-state-frames-and-ledger.md"
      - "docs/41-cpu-native-learning-research-s2-itl-operator-induction.md"
      - "docs/42-cpu-native-learning-research-s3-contrasts-and-versioning.md"
      - "docs/43-cpu-native-learning-research-s4-shard-proposals.md"
      - "docs/44-cpu-native-learning-research-s5-rdc-refutation-and-consolidation.md"
      - "docs/45-cpu-native-learning-research-s6-math-list-code-transfer.md"
      - "docs/46-cpu-native-learning-research-s7-grounding-and-byte-lm.md"
      - "docs/47-cpu-native-learning-research-s8-continual-learning-and-transfer.md"
      - ".github/workflows/cpu-learning-research.yml"
  pull_request:
    paths:
      - "research/cpu_learning/**"
      - "docs/39-cpu-native-learning-research-s0-audit-and-baseline.md"
      - "docs/40-cpu-native-learning-research-s1-state-frames-and-ledger.md"
      - "docs/41-cpu-native-learning-research-s2-itl-operator-induction.md"
      - "docs/42-cpu-native-learning-research-s3-contrasts-and-versioning.md"
      - "docs/43-cpu-native-learning-research-s4-shard-proposals.md"
      - "docs/44-cpu-native-learning-research-s5-rdc-refutation-and-consolidation.md"
      - "docs/45-cpu-native-learning-research-s6-math-list-code-transfer.md"
      - "docs/46-cpu-native-learning-research-s7-grounding-and-byte-lm.md"
      - "docs/47-cpu-native-learning-research-s8-continual-learning-and-transfer.md"
      - ".github/workflows/cpu-learning-research.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cpu-learning-s0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal CPU test dependencies
        run: python -m pip install --upgrade pip pytest cryptography

      - name: Compile research package
        run: python -m compileall -q research/cpu_learning

      - name: Run S0, S1, S2, S3, S4, S5, S6, S7 & S8 unit, isolation, domain-agnosticism, and canary tests
        run: python -m pytest -v research/cpu_learning/tests

      - name: Verify committed S0, S1, S2, S3, S4, S5, S6, S7 & S8 pre-registered manifests match generators bit-for-bit
        run: |
          python -m research.cpu_learning.evaluation.run_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s1_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s2_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s3_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s4_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s5_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s6_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s7_experiments --verify-manifests
          python -m research.cpu_learning.evaluation.run_s8_experiments --verify-manifests

      - name: Verify reproducible 5-seed S0, S1, S2, S3, S4, S5, S6, S7 & S8 benchmark gates
        run: |
          python -m research.cpu_learning.evaluation.run_experiments
          python -m research.cpu_learning.evaluation.run_s1_experiments
          python -m research.cpu_learning.evaluation.run_s2_experiments
          python -m research.cpu_learning.evaluation.run_s3_experiments
          python -m research.cpu_learning.evaluation.run_s4_experiments
          python -m research.cpu_learning.evaluation.run_s5_experiments
          python -m research.cpu_learning.evaluation.run_s6_experiments
          python -m research.cpu_learning.evaluation.run_s7_experiments
          python -m research.cpu_learning.evaluation.run_s8_experiments
