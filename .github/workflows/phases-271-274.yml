name: Mirror 7 phases-271-274
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q phase271_causal_intervention/test_phase271.py phase272_transfer_learning/test_phase272.py phase273_multimodal_conflict/test_phase273.py phase274_embodied_environment/test_phase274.py
