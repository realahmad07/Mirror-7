name: Mirror 7 phase-330 backend API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  phase330:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q mirror7_backend phase326_backend_service phase327_backend_hardening phase329_backend_integration phase330_backend_api
      - run: python -m pytest -q phase330_backend_api/test_phase330.py phase329_backend_integration/test_phase329.py mirror7_backend/test_http_server.py phase327_backend_hardening/test_phase327.py phase326_backend_service/test_phase326.py
