name: Mirror 7 phases 115-121 regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run phases 115-121
        run: >-
          python -m pytest -q
          phase115_action_executor
          phase116_tool_composition
          phase117_conflict_resolution
          phase118_memory_retrieval
          phase119_plan_verifier
          phase120_failure_recovery
          phase121_autonomous_task_loop
      - name: Run prior frontier regression
        run: >-
          python -m pytest -q
          phase108_grounded_dialogue phase109_knowledge_ingestion
          phase110_tool_guard phase111_task_decomposition
          phase112_self_monitor phase113_continual_agent_memory
          phase114_integrated_agent
