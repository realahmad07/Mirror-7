name: MIRROR7 Phase 27 Regenerate Artifact

on:
  push:
    branches: [main]
    paths:
      - 'phase27_unfinished/STEP2_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Phase 27 artifact
        run: python3 phase27_unfinished/build_phase27.py
      - name: Commit regenerated artifact
        id: commit
        run: |
          if git diff --quiet -- phase27_unfinished/compiler_phase27_words.mirr; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase27_unfinished/compiler_phase27_words.mirr
          git commit -m 'build(phase27): regenerate compiler artifact from canonical builder'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch Step 2 verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/phase27_step2_verify.yml/dispatches" \
            -d '{"ref":"main"}'
