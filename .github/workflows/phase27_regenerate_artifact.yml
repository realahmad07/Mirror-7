name: MIRROR7 Phase 27 Regenerate Artifact

on:
  push:
    branches: [main]
    paths:
      - 'phase27_unfinished/STEP2_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair canonical find-word target selector
        working-directory: phase27_unfinished
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_phase27.py')
          s = p.read_text()
          old = "char_loop_branch_i=body.index('branch:390')"
          new = "name_char_i=body.index('word-name-char')\n            char_loop_branch_i=next(i for i in range(name_char_i+1,len(body)) if body[i].startswith('branch:'))"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected canonical find-word target selector not found')
          PY
      - name: Stage Phase 26 source for builder
        working-directory: phase27_unfinished
        run: cp ../phase25_26/compiler_phase26_words.mirr compiler_phase26_words.mirr
      - name: Regenerate Phase 27 artifact
        working-directory: phase27_unfinished
        run: python3 build_phase27.py
      - name: Commit regenerated artifact and canonical source
        id: commit
        run: |
          if git diff --quiet -- phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr
          git commit -m 'fix(phase27): derive find-word targets structurally and regenerate'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch Step 2 verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/phase27_step2_verify.yml/dispatches" \
            -d '{"ref":"main"}'
