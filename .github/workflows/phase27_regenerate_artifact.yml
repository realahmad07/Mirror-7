name: MIRROR7 Phase 27 Regenerate and Verify Step 2

on:
  push:
    branches: [main]
    paths:
      - 'phase27_unfinished/STEP2_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair canonical find-word candidate equality
        working-directory: phase27_unfinished
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_phase27.py')
          s = p.read_text()
          old = "'0','13','!','0','14','!','word-count','swap','15','!','16','!',\n            ('BR','NOT_FOUND',True),"
          new = "'0','13','!','0','14','!','word-count','swap','15','!','16','!',\n            '13','@','15','@','=','14','@','16','@','=','+','2','=','0','=',('BR','NOT_FOUND',True),"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected find-word candidate equality insertion point not found')
          PY
      - name: Stage Phase 26 source for builder
        working-directory: phase27_unfinished
        run: cp ../phase25_26/compiler_phase26_words.mirr compiler_phase26_words.mirr
      - name: Regenerate Phase 27 artifact
        working-directory: phase27_unfinished
        run: python3 build_phase27.py
      - name: Verify Phase 27 Step 2
        run: python3 phase27_unfinished/verify_phase27.py
      - name: Record Step 2 PASS
        run: |
          cat > phase27_unfinished/STEP2_PASS.md <<EOF
          # Phase 27 Step 2 — PASS

          The complete surface parser gate passed through the canonical builder and nucleus.

          Verification run: ${GITHUB_RUN_ID}
          Head before record: ${GITHUB_SHA}
          EOF
      - name: Commit regenerated artifact, canonical source, and PASS record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase27_unfinished/build_phase27.py phase27_unfinished/compiler_phase27_words.mirr phase27_unfinished/STEP2_PASS.md
          git commit -m 'test(phase27): record Step 2 surface parser PASS'
          git push
