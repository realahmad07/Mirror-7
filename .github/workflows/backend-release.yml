name: Mirror 7 backend release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest build
      - run: python -m pytest -q
      - run: python -m compileall -q mirror7_backend
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: mirror7-backend-dist
          path: dist/
