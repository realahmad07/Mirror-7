name: Mirror 7 | Native Brain Training Checks

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "requirements-training.txt"
      - "pyproject.toml"
      - ".github/workflows/training-native.yml"
  pull_request:
    paths:
      - "training/**"
      - "requirements-training.txt"
      - "pyproject.toml"
      - ".github/workflows/training-native.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRROR_SANDBOX_MODE: container
      MIRROR_REQUIRE_CONTAINER_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt pytest
          # This workflow also collects a Mirror Crystal integration test.
          python -m pip install -e .
      - name: Pull pinned isolated Python sandbox image
        run: docker pull python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
      - name: Compile training code
        run: python -m compileall -q training
      - name: Native-brain tests
        run: python -m pytest -q training/test_native_brain.py training/test_experiment6_learned_operations.py training/test_cpu_autonomous_engine.py
      - name: Run three-seed semantic screening
        continue-on-error: true
        run: >-
          python -m training.evaluate_experiment6
          --device cpu --epochs 240 --seeds 17,29,43
          --transition-supervision-weight 1.0
          --output artifacts/exp6_multiseed_screening_ci.json
      - name: Run three-seed structured-operator ablation
        continue-on-error: true
        run: >-
          python -m training.evaluate_experiment6
          --device cpu --epochs 240 --seeds 17,29,43
          --transition-supervision-weight 1.0
          --transition-architecture linear_operator
          --output artifacts/exp6_operator_multiseed_screening_ci.json
      - name: Upload semantic screening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp6-multiseed-screening
          path: |
            artifacts/exp6_multiseed_screening_ci.json
            artifacts/exp6_operator_multiseed_screening_ci.json
          if-no-files-found: ignore
      - name: Enforce structured-operator three-seed screen
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/exp6_operator_multiseed_screening_ci.json")
          if not report_path.exists():
              raise SystemExit("Structured-operator screening report is missing")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not report.get("screening_passed_all_seeds", False):
              raise SystemExit(
                  "Structured-operator research gate failed; see the uploaded per-seed report"
              )
          print("All three structured-operator seeds passed the screening gate.")
          PY
