name: Mirror 7 phase-338 security boundary
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  phase338:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q phase338_security_boundary/test_phase338.py
      - run: python -m compileall -q mirror7_backend
