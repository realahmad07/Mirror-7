name: One-time V5 source import

on:
  push:
    branches:
      - phase367-v5-source-integration
    paths:
      - ".github/import/**"
      - ".github/workflows/phase367-import-v5.yml"

permissions:
  contents: write

jobs:
  import-v5-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reassemble and import reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/import/chunks/00 \
            .github/import/chunks/01 \
            .github/import/pieces/02/00 .github/import/pieces/02/01 .github/import/pieces/02/02 \
            .github/import/pieces/02/03 .github/import/pieces/02/04 .github/import/pieces/02/05 \
            .github/import/pieces/02/06 .github/import/pieces/02/07 .github/import/pieces/02/08 \
            .github/import/pieces/02/09 .github/import/pieces/02/10 .github/import/pieces/02/11 \
            .github/import/chunks/03 .github/import/chunks/04 .github/import/chunks/05 \
            .github/import/chunks/06 .github/import/chunks/07 .github/import/chunks/08 \
            .github/import/pieces/09/00 .github/import/pieces/09/01 .github/import/pieces/09/02 \
            .github/import/pieces/09/03 .github/import/pieces/09/04 .github/import/pieces/09/05 \
            .github/import/chunks/10 > /tmp/v5-source.tar.xz.b64
          base64 --decode /tmp/v5-source.tar.xz.b64 > /tmp/v5-source.tar.xz
          echo "Expected archive SHA-256: 8c57dcb936e44a42f99d72436db8039cc2dd1b25b248fc2d3698b85865063b3b"
          echo "Actual archive SHA-256:"
          sha256sum /tmp/v5-source.tar.xz
          echo "8c57dcb936e44a42f99d72436db8039cc2dd1b25b248fc2d3698b85865063b3b  /tmp/v5-source.tar.xz" | sha256sum --check
          tar -tJf /tmp/v5-source.tar.xz > /tmp/v5-source-files.txt
          tar -xJf /tmp/v5-source.tar.xz -C .
          rm -rf .github/import
          rm -f .github/workflows/phase367-import-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected"
            exit 1
          fi
          git commit -m "Integrate reviewed V5 native model and training pipeline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
