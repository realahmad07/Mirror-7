name: One-time V5 source import

on:
  push:
    branches:
      - phase367-v5-source-integration
    paths:
      - ".github/import/chunks/**"
      - ".github/workflows/phase367-import-v5.yml"

permissions:
  contents: write

jobs:
  import-v5-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reassemble and import reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/chunks/* > /tmp/v5-source.tar.xz.b64
          base64 --decode /tmp/v5-source.tar.xz.b64 > /tmp/v5-source.tar.xz
          tar -tJf /tmp/v5-source.tar.xz > /tmp/v5-source-files.txt
          tar -xJf /tmp/v5-source.tar.xz -C .
          rm -rf .github/import
          rm -f .github/workflows/phase367-import-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected"
            exit 1
          fi
          git commit -m "Integrate reviewed V5 native model and training pipeline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
